<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viagem Indochina</title>
<meta name="description" content="Viagem Indochina: guia de quatro países, fotos, roteiro, voos, hotéis e transfer contratado de Hue a Hoi An. Retorno em 24/01/2027 a confirmar no bilhete.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2030'/%3E%3Cpath d='M7 23c4-11 7-11 9-5s5 5 9-8' fill='none' stroke='%23F7DE8D' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='23' r='2.6' fill='%23F7DE8D'/%3E%3Ccircle cx='25' cy='10' r='2.6' fill='%23F7DE8D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Viagem Indochina — estilos
   Duas vozes: a serifada narra (descrições), a grotesca informa (datas,
   horários, status). Cor só identifica país; status tem forma + palavra.
   ========================================================================== */

:root{
  color-scheme: light;
  --papel:#FBF6EC; --papel-2:#F3ECDC; --folha:#FFFDF7;
  --tinta:#1B2030; --tinta-2:#474E62; --tinta-3:#676D80;
  --linha:#DED4BF; --linha-2:#C2B69B;
  --elo:#27408B; --foco:#27408B;
  --marca:#F7DE8D;
  --th:#8F5600; --th-f:#F5E6C4;
  --la:#1D6B58; --la-f:#DBEEE6;
  --kh:#3F5B77; --kh-f:#E0E8F0;
  --vn:#A22B2B; --vn-f:#F6DEDA;
  --ok:#1D6B58; --ok-f:#DBEEE6;
  --res:#27408B; --res-f:#E1E7F6;
  --pend:#8A5200; --pend-f:#F8E9C8;
  --neutro:#535A6C; --neutro-f:#ECE6D8;
  --alerta:#A22B2B; --alerta-f:#F8E1DC;
  --sombra:0 1px 0 rgba(27,32,48,.05), 0 10px 24px -16px rgba(27,32,48,.35);
  --f-tit:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-txt:"Source Serif 4","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --larg:1140px;
  --topo-alt:104px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --papel:#14171F; --papel-2:#1A1E2A; --folha:#1E2332;
    --tinta:#EFE9DC; --tinta-2:#C4BEB0; --tinta-3:#A19C90;
    --linha:#31374A; --linha-2:#4A536B;
    --elo:#B3C2FF; --foco:#B3C2FF;
    --marca:rgba(247,222,141,.26);
    --th:#E8BA66; --th-f:#3A2E14;
    --la:#7AD2B8; --la-f:#14332B;
    --kh:#A9C2DC; --kh-f:#1D2A3A;
    --vn:#F49A91; --vn-f:#3D1C1A;
    --ok:#7AD2B8; --ok-f:#14332B;
    --res:#B3C2FF; --res-f:#1F2947;
    --pend:#E8BA66; --pend-f:#3A2E14;
    --neutro:#B8B3A7; --neutro-f:#272B38;
    --alerta:#F49A91; --alerta-f:#3D1C1A;
    --sombra:0 1px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --papel:#14171F; --papel-2:#1A1E2A; --folha:#1E2332;
  --tinta:#EFE9DC; --tinta-2:#C4BEB0; --tinta-3:#A19C90;
  --linha:#31374A; --linha-2:#4A536B;
  --elo:#B3C2FF; --foco:#B3C2FF;
  --marca:rgba(247,222,141,.26);
  --th:#E8BA66; --th-f:#3A2E14;
  --la:#7AD2B8; --la-f:#14332B;
  --kh:#A9C2DC; --kh-f:#1D2A3A;
  --vn:#F49A91; --vn-f:#3D1C1A;
  --ok:#7AD2B8; --ok-f:#14332B;
  --res:#B3C2FF; --res-f:#1F2947;
  --pend:#E8BA66; --pend-f:#3A2E14;
  --neutro:#B8B3A7; --neutro-f:#272B38;
  --alerta:#F49A91; --alerta-f:#3D1C1A;
  --sombra:0 1px 0 rgba(0,0,0,.35), 0 12px 26px -16px rgba(0,0,0,.8);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topo-alt) + 14px)}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 1.0625rem/1.6 var(--f-txt);font-optical-sizing:auto;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--papel)}
h1,h2,h3,h4,h5{font-family:var(--f-tit);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.012em;text-wrap:balance}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
ul,ol{margin:0;padding:0}
a{color:var(--elo);text-decoration-thickness:.07em;text-underline-offset:.18em}
a:hover{text-decoration-thickness:.14em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}
mark{background:none;color:inherit;font-weight:600;box-shadow:inset 0 -.52em 0 var(--marca);padding:0 .06em;border-radius:1px}
time{font-variant-numeric:tabular-nums}
.vh{position:absolute !important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.miolo{max-width:var(--larg);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.so-impressao{display:none}
.num{font-family:var(--f-tit);font-variant-numeric:tabular-nums lining-nums}

.pular{position:absolute;left:12px;top:-80px;z-index:60;background:var(--tinta);color:var(--papel);padding:12px 16px;border-radius:8px;font:600 .95rem var(--f-tit);text-decoration:none}
.pular:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* país: a cor entra como filete e rótulo, nunca sozinha */
.p-th{--p:var(--th);--pf:var(--th-f)}
.p-la{--p:var(--la);--pf:var(--la-f)}
.p-kh{--p:var(--kh);--pf:var(--kh-f)}
.p-vn{--p:var(--vn);--pf:var(--vn-f)}
.p-xx{--p:var(--tinta-3);--pf:var(--papel-2)}

/* ---------- topo e abas ---------- */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--papel);border-bottom:1px solid var(--linha)}
.topo-linha{display:flex;align-items:center;gap:10px;min-height:54px;position:relative}
.marca-site{font:800 1.2rem/1 var(--f-tit);font-variation-settings:"wdth" 86;letter-spacing:-.015em;white-space:nowrap}
.marca-site a{color:inherit;text-decoration:none;display:inline-block;padding:8px 0}
.topo-datas{display:none;margin:0;font:500 .86rem/1.2 var(--f-tit);color:var(--tinta-2);padding-left:14px;border-left:1px solid var(--linha-2)}
.topo-acoes{display:flex;gap:2px;margin-left:auto}
.btn-ic{inline-size:44px;block-size:44px;display:grid;place-items:center;border:0;background:none;border-radius:10px;color:var(--tinta)}
.btn-ic:hover{background:var(--papel-2)}
.btn-ic .ic{width:22px;height:22px}
.so-largo{display:none}

.busca{display:none;position:absolute;inset-inline:0;top:100%;z-index:5;background:var(--papel);padding:10px clamp(16px,4vw,40px) 14px;border-bottom:1px solid var(--linha);box-shadow:var(--sombra)}
.busca.aberta{display:block}
.busca-campo{display:flex;align-items:center;gap:8px;background:var(--folha);border:1.5px solid var(--linha-2);border-radius:999px;padding:0 14px;min-height:44px}
.busca-campo:focus-within{border-color:var(--foco);outline:3px solid var(--foco);outline-offset:1px}
.busca-campo .ic{color:var(--tinta-2)}
.busca-campo input{flex:1;min-width:0;border:0;background:none;font:500 .95rem var(--f-tit);padding:8px 0;outline:none}
.busca-campo input::placeholder{color:var(--tinta-3);opacity:1}
.busca-res{margin-top:10px;max-height:min(62vh,520px);overflow:auto;overscroll-behavior:contain}
.busca-conta{font:600 .82rem var(--f-tit);color:var(--tinta-2);margin:0 0 6px;padding:0 4px}
.busca-grupo{margin:0 0 10px}
.busca-grupo h2{font-size:.78rem;font-weight:700;color:var(--tinta-2);padding:6px 4px 4px;letter-spacing:0}
.busca-grupo ul{list-style:none}
.busca-grupo a{display:block;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--tinta);font-family:var(--f-tit);line-height:1.3}
.busca-grupo a:hover,.busca-grupo a:focus-visible{background:var(--papel-2)}
.busca-grupo a strong{display:block;font-weight:650;font-size:.95rem}
.busca-grupo a span{display:block;font-size:.82rem;color:var(--tinta-2)}
.busca-vazio{padding:8px 4px 4px;font-family:var(--f-tit);font-size:.92rem}
.busca-vazio p{margin:0 0 10px}

.abas-caixa{position:relative}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x proximity;margin-inline:-6px;padding-inline:6px}
.abas::-webkit-scrollbar{display:none}
.aba{flex:none;scroll-snap-align:center;border:0;background:none;padding:11px 12px 10px;min-height:46px;font:600 .93rem/1.1 var(--f-tit);color:var(--tinta-2);border-bottom:3px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
.aba:hover{color:var(--tinta);background:var(--papel-2)}
.aba[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--tinta);font-weight:750}
.aba:focus-visible{outline-offset:-3px}
.aba .rot-longo{display:none}
.abas-caixa::before,.abas-caixa::after{position:absolute;top:0;bottom:1px;width:34px;pointer-events:none;opacity:0;z-index:2;display:flex;align-items:center;font:700 1.25rem/1 var(--f-tit);color:var(--tinta-2)}
.abas-caixa::before{content:"‹";left:0;justify-content:flex-start;padding-left:4px;background:linear-gradient(to right,var(--papel) 55%,transparent)}
.abas-caixa::after{content:"›";right:0;justify-content:flex-end;padding-right:4px;background:linear-gradient(to left,var(--papel) 55%,transparent)}
.abas-caixa.rola-esq::before,.abas-caixa.rola-dir::after{opacity:1}

/* ---------- painéis ---------- */
main{padding-block:clamp(22px,4vw,40px) 64px;min-height:70vh}
.painel{outline:none}
.painel:focus-visible{box-shadow:0 -3px 0 var(--foco)}
.painel-cab{max-width:46rem;margin-bottom:clamp(18px,3vw,30px)}
.painel-cab h2{font-size:clamp(1.9rem,5.2vw,2.9rem);font-weight:800;font-variation-settings:"wdth" 84;letter-spacing:-.025em;line-height:1}
.painel-cab p{margin-top:.7em;color:var(--tinta-2);font-size:1.08rem}
h3.sec{font-size:clamp(1.25rem,3vw,1.55rem);font-weight:750;margin:0 0 12px}

/* botões, chips, selos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border:1.5px solid var(--tinta);border-radius:999px;background:none;color:var(--tinta);font:600 .9rem/1.1 var(--f-tit);text-decoration:none}
.btn:hover{background:var(--tinta);color:var(--papel)}
.btn-leve{border-color:var(--linha-2)}
.btn-leve:hover{background:var(--papel-2);color:var(--tinta);border-color:var(--tinta)}
.barra{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin:0 0 8px;padding:14px 0;border-block:1px solid var(--linha)}
.barra-grupo{display:flex;flex-direction:column;gap:6px;min-width:0}
.barra-rot{font:650 .8rem var(--f-tit);color:var(--tinta-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:7px 14px;border:1.5px solid var(--linha-2);border-radius:999px;background:var(--folha);color:var(--tinta);font:600 .86rem/1.1 var(--f-tit);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.chip[aria-pressed="true"]::before{content:"";width:.5em;height:.9em;border:solid currentColor;border-width:0 .16em .16em 0;transform:rotate(42deg) translate(-.05em,-.1em);margin-right:.2em}
.chip .ponto{width:9px;height:9px;border-radius:50%;background:var(--p)}
.chip[aria-pressed="true"] .ponto{display:none}
@media (pointer:coarse){.chip{min-height:44px}}
.sel{min-height:44px;padding:8px 36px 8px 14px;border:1.5px solid var(--linha-2);border-radius:999px;background:var(--folha);font:600 .86rem var(--f-tit);max-width:100%}
.barra-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.conta{font:600 .85rem var(--f-tit);color:var(--tinta-2);margin:10px 0 0}
.vazio{margin:26px 0;padding:22px;border:1.5px dashed var(--linha-2);border-radius:14px;text-align:left;font-family:var(--f-tit)}
.vazio p{margin:0 0 12px;font-size:1rem}

.selo{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font:650 .78rem/1.25 var(--f-tit);border:1.5px solid currentColor;white-space:nowrap}
.selo .ic{width:1.05em;height:1.05em}
.selo-pago{color:var(--ok);background:var(--ok-f);border-style:solid}
.selo-res{color:var(--res);background:var(--res-f);border-style:solid}
.selo-cot{color:var(--pend);background:var(--pend-f);border-style:dashed}
.selo-con{color:var(--pend);background:none;border-style:dashed}
.selo-def{color:var(--neutro);background:none;border-style:dotted}
.selo-liv{color:var(--neutro);background:var(--neutro-f);border-color:transparent}
.papel{display:inline-block;font:700 .74rem/1.25 var(--f-tit);padding:3px 8px;border-radius:4px;max-width:100%}
.papel-planejado{background:var(--tinta);color:var(--papel)}
.papel-opcional{border:1.5px dashed var(--tinta-3);color:var(--tinta-2)}
.papel-alternativa{border:1.5px solid var(--tinta-3);color:var(--tinta-2);font-style:italic}
.papel-livre{background:var(--neutro-f);color:var(--neutro)}

.aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--linha-2);background:var(--folha);font:500 .93rem/1.45 var(--f-tit);margin:12px 0}
.aviso .ic{margin-top:.12em;width:1.2em;height:1.2em}
.aviso p{margin:0}
.aviso-alerta{border-color:var(--alerta);background:var(--alerta-f)}
.aviso-alerta .ic{color:var(--alerta)}
.aviso-pend{border-style:dashed;border-color:var(--pend)}
.aviso-pend .ic{color:var(--pend)}
.aviso-log{border-color:var(--tinta);border-width:1.5px}

/* ---------- visão geral ---------- */
.vg{display:grid;gap:clamp(26px,5vw,44px)}
.mostra{font-size:clamp(2.8rem,13.5vw,6.2rem);font-weight:800;font-variation-settings:"wdth" 80;letter-spacing:-.032em;line-height:.88;margin:0 0 .24em}
.mostra span{display:block}
.vg-datas{font:650 1.02rem/1.3 var(--f-tit);margin:0 0 14px}
.lede{font-size:clamp(1.12rem,2.4vw,1.28rem);line-height:1.5;max-width:36rem;margin-bottom:1.1em}
.numeros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0 0 20px;border-top:2px solid var(--tinta);max-width:36rem}
.numeros div{padding:12px 12px 10px 0;border-bottom:1px solid var(--linha)}
.numeros dd{margin:0;font:800 2.2rem/1 var(--f-tit);font-variation-settings:"wdth" 80;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.numeros dt{font:600 .84rem/1.25 var(--f-tit);color:var(--tinta-2);margin-top:4px}
.atalhos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.contagem{font:600 .92rem var(--f-tit);color:var(--tinta-2);margin:0}
.contagem a{font-weight:700}

.vg-rota h3,.vg-bloco h3{font-size:1.2rem;font-weight:750;margin-bottom:14px}
.fio{list-style:none;position:relative}
.fio>li{position:relative;padding:0 0 20px 34px}
.fio>li::before{content:"";position:absolute;left:8px;top:8px;bottom:-8px;width:2px;background:var(--linha-2)}
.fio>li:last-child{padding-bottom:0}
.fio>li:last-child::before{display:none}
.fio>li::after{content:"";position:absolute;left:2px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--p);box-shadow:0 0 0 4px var(--papel)}
.fio-chegada{display:block;font:600 .78rem/1.2 var(--f-tit);color:var(--tinta-2);margin:0 0 3px}
.fio-chegada a{color:inherit}
.fio-cidade{font:750 1.15rem/1.2 var(--f-tit)}
.fio-cidade a{color:var(--tinta);text-decoration:none;box-shadow:inset 0 -2px 0 var(--p)}
.fio-cidade a:hover{box-shadow:inset 0 -.5em 0 var(--pf)}
.fio-meta{display:block;font:500 .88rem/1.35 var(--f-tit);color:var(--tinta-2);margin-top:2px}
.fio-pais{color:var(--p);font-weight:700}
.fio-bv{list-style:none;margin:8px 0 0}
.fio-bv li{position:relative;padding:1px 0 1px 20px;font:500 .88rem/1.35 var(--f-tit)}
.fio-bv li::before{content:"";position:absolute;left:0;top:.42em;width:10px;height:10px;border-radius:50%;border:2px solid var(--p);background:var(--papel)}
.fio-bv a{color:var(--tinta)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 .82rem var(--f-tit);color:var(--tinta-2);margin:16px 0 0;padding-top:12px;border-top:1px solid var(--linha)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.lg-b,.lg-o{width:11px;height:11px;border-radius:50%;background:var(--tinta)}
.lg-o{background:none;border:2px solid var(--tinta)}

.vg-bloco{padding-top:clamp(18px,3vw,26px);border-top:2px solid var(--tinta)}
.destaques{list-style:none;display:grid;gap:0}
.destaques li{border-bottom:1px solid var(--linha)}
.destaques a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:11px 2px;text-decoration:none;color:var(--tinta)}
.destaques a:hover .dq-nome{box-shadow:inset 0 -.5em 0 var(--marca)}
.dq-nome{font:700 1.02rem/1.25 var(--f-tit);justify-self:start}
.dq-onde{font:500 .84rem var(--f-tit);color:var(--tinta-2);grid-column:1}
.dq-data{font:650 .84rem var(--f-tit);color:var(--tinta-2);grid-row:1 / span 2;grid-column:2;align-self:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.falta{list-style:none;display:grid;gap:10px}
.falta li{display:grid;grid-template-columns:auto 1fr;gap:10px;font:500 .95rem/1.4 var(--f-tit)}
.falta .ic{color:var(--pend);margin-top:.15em}
.falta strong,.falta mark{font-weight:700;box-shadow:none;padding:0}

/* ---------- calendário ---------- */
.cal-mes{margin:0 0 30px}
.cal-mes h3{font-size:1.4rem;font-weight:800;margin-bottom:10px}
.cal-grade{display:none}
.agenda{list-style:none;border-top:1px solid var(--linha)}
.agenda li{border-bottom:1px solid var(--linha)}
.ag-link{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 2px 12px 10px;text-decoration:none;color:var(--tinta);border-left:4px solid var(--p)}
.ag-link:hover{background:var(--papel-2)}
.ag-quando{font-family:var(--f-tit);line-height:1.1}
.ag-num{display:block;font:800 1.65rem/1 var(--f-tit);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ag-sem{display:block;font-size:.82rem;font-weight:600;color:var(--tinta-2);margin-top:2px}
.ag-dia{display:block;font-size:.76rem;font-weight:700;color:var(--p);margin-top:4px}
.ag-local{display:block;font:700 1.02rem/1.25 var(--f-tit)}
.ag-ativ{display:block;font-size:.95rem;line-height:1.4;color:var(--tinta-2);margin:2px 0 6px}
.ag-pe{display:flex;flex-wrap:wrap;gap:4px 14px;font:600 .8rem/1.3 var(--f-tit);color:var(--tinta-2)}
.ag-pe span{display:inline-flex;align-items:center;gap:5px}
.ag-pe .tr{color:var(--tinta)}

/* ---------- países e cidades ---------- */
.pais{margin:0 0 clamp(34px,6vw,60px);padding-top:18px;border-top:4px solid var(--p)}
.pais-cab{display:grid;gap:14px;margin-bottom:20px}
.pais-nome{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;font-variation-settings:"wdth" 82;letter-spacing:-.03em;color:var(--p)}
.pais-papel{font:600 .95rem/1.4 var(--f-tit);color:var(--tinta-2);margin:6px 0 14px}
.pais-intro{font-size:1.1rem;max-width:40rem}
.fatos{display:grid;gap:0;margin:0;border-top:1px solid var(--linha)}
.fatos div{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-bottom:1px solid var(--linha)}
.fatos dt{font:700 .84rem var(--f-tit);color:var(--p)}
.fatos dd{margin:0;font-size:.98rem;line-height:1.5}
.cidades{display:grid;gap:16px;margin-top:20px}
.cidade{background:var(--folha);border:1px solid var(--linha);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--sombra)}
.cidade h4{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.cid-tipo{font:650 .84rem/1.35 var(--f-tit);color:var(--tinta-2);margin:4px 0 10px}
.cid-links{list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px;margin:12px 0 0;font:600 .86rem var(--f-tit)}
.cid-links a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--linha-2);border-radius:999px;text-decoration:none;color:var(--tinta);min-height:38px}
.cid-links a:hover{border-color:var(--tinta)}
.cid-atr{font:500 .9rem/1.5 var(--f-tit);margin:12px 0 0}
.cid-atr strong{font-weight:750}
.bvs{list-style:none;margin:14px 0 0;display:grid;gap:10px}
.bv{padding:12px 0 0 14px;border-left:3px dotted var(--p)}
.bv h5{font-size:1.02rem;font-weight:750}
.bv-rot{font:650 .82rem/1.35 var(--f-tit);color:var(--p);margin:2px 0 4px}
.bv p{font-size:.96rem;line-height:1.5}

/* ---------- roteiro ---------- */
.etapa{margin:26px 0 0}
.etapa-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 0 10px;border-bottom:2px solid var(--tinta);position:relative}
.etapa-cab h3{font-size:clamp(1.3rem,3.6vw,1.75rem);font-weight:800;letter-spacing:-.02em}
.etapa-cab p{font:600 .88rem/1.3 var(--f-tit);color:var(--tinta-2);margin:0}
.dias{list-style:none}
.dia{border-bottom:1px solid var(--linha);border-left:4px solid var(--p);padding-left:14px;padding-right:10px}
.dia.em-foco{background:var(--pf);background:color-mix(in srgb,var(--pf) 55%,transparent)}
.dia-cab{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:16px 0 14px}
.dia-quando{display:flex;align-items:baseline;gap:10px;font-family:var(--f-tit)}
.dia-n{font-weight:800;font-size:1rem;color:var(--p)}
.dia-quando time{font-size:.9rem;font-weight:600;color:var(--tinta-2)}
.dia-onde{font:650 .84rem/1.3 var(--f-tit);color:var(--tinta-2);margin:0 0 3px}
.dia-tit{font-size:clamp(1.22rem,3.3vw,1.5rem);font-weight:750;letter-spacing:-.018em;outline:none}
.dia-res{margin:8px 0 0;max-width:44rem}
.dia-cab .aviso{max-width:44rem}
.etqs{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.etq{display:inline-flex;align-items:center;gap:5px;font:650 .78rem/1.2 var(--f-tit);padding:4px 9px;border-radius:4px;background:var(--papel-2);color:var(--tinta)}
.etq .ic{width:1.1em;height:1.1em}
.dia-pe{display:grid;gap:5px;margin:10px 0 0;font:500 .9rem/1.35 var(--f-tit);color:var(--tinta-2)}
.dia-pe>span{display:flex;align-items:flex-start;gap:7px}
.dia-pe>span>.ic{margin-top:.1em;color:var(--tinta)}
.dia-pe a{color:var(--tinta);font-weight:650}
.dia-btn{justify-self:start;margin-top:6px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px 8px 12px;border:1.5px solid var(--linha-2);border-radius:999px;background:var(--folha);font:650 .86rem var(--f-tit)}
.dia-btn:hover{border-color:var(--tinta)}
.dia-btn .ic{transition:transform .15s}
.dia-btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.dia-det{padding:2px 0 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:48rem}
.det h5{font-size:.84rem;font-weight:750;color:var(--tinta-2);margin:0 0 8px}
.periodos{margin:0;display:grid;gap:0;border-top:1px solid var(--linha)}
.periodos div{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}
.periodos dt{font:750 .86rem/1.5 var(--f-tit);padding-top:.12em}
.periodos dd{margin:0}
.ativs{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ativ{display:grid;gap:5px;padding:10px 12px;background:var(--folha);border:1px solid var(--linha);border-radius:10px}
.ativ-topo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ativ-nome{font:650 .98rem/1.3 var(--f-tit)}
.ativ-nome a{color:var(--tinta)}
.ativ-meta{font:500 .84rem/1.4 var(--f-tit);color:var(--tinta-2);margin:0}
.bilhete{display:grid;gap:6px;padding:12px 14px;border:1.5px solid var(--tinta);border-radius:10px;background:var(--folha);font-family:var(--f-tit)}
.bil-rota{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:750;font-size:1rem;line-height:1.25}
.bil-hora{font:750 1.15rem/1.1 var(--f-tit);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bil-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.86rem;font-weight:500;color:var(--tinta-2)}
.bil-meta a{font-weight:650}
.lista{list-style:none;display:grid;gap:8px}
.lista li{position:relative;padding-left:18px;font-size:.98rem;line-height:1.5}
.lista li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--tinta-3)}
.lista-pend li::before{background:none;border:1.5px solid var(--pend);width:8px;height:8px;left:1px;top:.55em}

/* ---------- atrações ---------- */
.grupo-cid{margin:28px 0 0}
.grupo-cid>h3{font-size:clamp(1.3rem,3.6vw,1.7rem);font-weight:800;letter-spacing:-.02em;padding-bottom:8px;border-bottom:2px solid var(--p);margin-bottom:14px}
.grupo-cid>h3 small{font:600 .86rem var(--f-tit);color:var(--p);letter-spacing:0;margin-left:8px}
.atrs{list-style:none;display:grid;gap:14px}
.atr{background:var(--folha);border:1px solid var(--linha);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--sombra)}
.atr.em-foco{border-color:var(--tinta);box-shadow:0 0 0 2px var(--tinta)}
.atr-topo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.atr h4{font-size:1.18rem;font-weight:750;letter-spacing:-.015em;outline:none}
.atr-onde{font:600 .84rem var(--f-tit);color:var(--tinta-2);margin:3px 0 10px}
.atr-oque{font-size:1rem;line-height:1.55}
.atr-quando{list-style:none;display:grid;gap:6px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--linha);font:500 .88rem/1.35 var(--f-tit)}
.atr-quando li{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
.atr-quando a{font-weight:700}
.atr-mais{display:grid;gap:10px;margin-top:12px}
.atr-mais h5{font-size:.82rem;font-weight:750;color:var(--tinta-2);margin-bottom:3px}
.atr-mais p{font-size:.97rem;line-height:1.5}
.atr .dia-btn{margin-top:12px}

/* ---------- voos e hotéis ---------- */
.trechos{list-style:none;display:grid;gap:14px;margin-top:18px}
.trecho{display:grid;gap:0;background:var(--folha);border:1px solid var(--linha-2);border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
.trecho.em-foco{box-shadow:0 0 0 2px var(--tinta)}
.tr-quando{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--papel-2);border-bottom:1px dashed var(--linha-2);font-family:var(--f-tit)}
.tr-quando .ic{width:20px;height:20px}
.tr-data{font-weight:750;font-size:.95rem}
.tr-tipo{font-weight:600;font-size:.84rem;color:var(--tinta-2)}
.tr-dia{margin-left:auto;font-weight:650;font-size:.84rem}
.tr-corpo{padding:14px 16px 16px;display:grid;gap:12px}
.tr-rota{font-size:clamp(1.18rem,3.6vw,1.45rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;outline:none}
.tr-pontos{display:grid;gap:8px;font-family:var(--f-tit)}
.tr-ponto{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline}
.tr-hora{font:800 1.3rem/1 var(--f-tit);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tr-hora small{display:block;font:650 .72rem/1.2 var(--f-tit);color:var(--tinta-2);letter-spacing:0;margin-top:3px}
.tr-hora small.mais{color:var(--pend)}
.tr-via{font:600 .88rem/1.35 var(--f-tit);color:var(--tinta-2);margin:-6px 0 0}
.notas-topo{margin:0 0 18px;max-width:50rem}
.tr-lugar{font-size:.95rem;font-weight:650;line-height:1.3}
.tr-lugar span{display:block;font-weight:500;font-size:.84rem;color:var(--tinta-2)}
.tr-dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:0;font-family:var(--f-tit);padding-top:10px;border-top:1px solid var(--linha)}
.tr-dados dt{font-size:.76rem;font-weight:650;color:var(--tinta-2)}
.tr-dados dd{margin:1px 0 0;font-size:.92rem;font-weight:600;line-height:1.3}
.tr-dados dd.nao{font-weight:500;color:var(--tinta-2);font-style:italic}
.tr-sub{font-size:.8rem;font-weight:750;color:var(--tinta-2);padding-top:12px;border-top:1px solid var(--linha);margin-bottom:-4px}
.traslados{list-style:none;display:grid;gap:8px;font:500 .88rem/1.35 var(--f-tit)}
.traslados li{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
.traslados .tt{font-weight:650}

.hoteis{list-style:none;display:grid;gap:16px;margin-top:18px}
.hotel{background:var(--folha);border:1px solid var(--linha-2);border-top:4px solid var(--p);border-radius:6px 6px 14px 14px;padding:16px 16px 16px;box-shadow:var(--sombra);display:grid;gap:12px}
.hotel.em-foco{box-shadow:0 0 0 2px var(--tinta)}
.hotel-onde{font:650 .84rem var(--f-tit);color:var(--p);margin:0 0 2px}
.hotel h3{font-size:clamp(1.25rem,3.8vw,1.6rem);font-weight:800;letter-spacing:-.02em;outline:none}
.hotel-datas{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 22px;margin:0;font-family:var(--f-tit)}
.hotel-datas dt{font-size:.76rem;font-weight:650;color:var(--tinta-2)}
.hotel-datas dd{margin:0;font-size:1.02rem;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2}
.hotel-datas dd small{display:block;font-size:.76rem;font-weight:500;color:var(--tinta-2)}
.noites{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.noite{display:grid;justify-items:center;gap:2px;min-width:62px;padding:6px 8px 5px;border-radius:8px;border:1.5px solid var(--res);background:var(--res-f);color:var(--res);font-family:var(--f-tit)}
.noite b{font-size:.86rem;font-weight:750;font-variant-numeric:tabular-nums}
.noite span{font-size:.68rem;font-weight:650;line-height:1.15;text-align:center}
.noite-pend{border-style:dashed;border-color:var(--pend);background:var(--pend-f);color:var(--pend)}
.noite-pago{border-color:var(--ok);background:var(--ok-f);color:var(--ok)}
.hotel-status{font:600 .9rem/1.4 var(--f-tit);margin:0}
.hotel-status .ic{color:var(--pend)}
.hotel-desc{font-size:1rem;line-height:1.55;margin:0;max-width:44rem}
.hotel-pe{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.hotel-nota{font:500 .8rem/1.4 var(--f-tit);color:var(--tinta-2);margin:0}
.nota-geral{font:500 .88rem/1.45 var(--f-tit);color:var(--tinta-2);max-width:46rem;margin:14px 0 0}

/* ---------- orientações ---------- */
.ori{display:grid;gap:clamp(26px,4vw,40px)}
.ori-sec{;padding-top:16px;border-top:2px solid var(--tinta)}
.ori-sec>h3{font-size:clamp(1.3rem,3.6vw,1.65rem);font-weight:800;letter-spacing:-.02em;margin-bottom:12px;outline:none}
.ori-sec>p,.ori-sec>.lista{max-width:46rem}
.entradas{list-style:none;display:grid;gap:14px;margin:16px 0}
.entrada{background:var(--folha);border:1px solid var(--linha);border-left:4px solid var(--p);border-radius:4px 12px 12px 4px;padding:14px 16px}
.entrada h4{font-size:1.15rem;font-weight:800;color:var(--p)}
.entrada-quando{font:650 .86rem/1.35 var(--f-tit);color:var(--tinta-2);margin:2px 0 10px}
.entrada dl{margin:0;display:grid;gap:8px}
.entrada dt{font:750 .8rem var(--f-tit);color:var(--tinta-2)}
.entrada dd{margin:1px 0 0;font-size:.97rem;line-height:1.5}
.entrada-links{list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font:600 .86rem var(--f-tit)}
.entrada-links a{display:inline-flex;align-items:center;gap:5px;padding:6px 0;min-height:32px}
.check{list-style:none;display:grid;gap:2px;max-width:46rem}
.check h4{font-size:.95rem;font-weight:750;margin:14px 0 6px}
.check label{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:9px 6px;border-radius:8px;font-size:.98rem;line-height:1.45;cursor:pointer;min-height:44px}
.check label:hover{background:var(--papel-2)}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--tinta)}
.check input:checked + span{color:var(--tinta-2);text-decoration:line-through;text-decoration-color:var(--linha-2)}
.fontes{list-style:none;display:grid;gap:10px;max-width:48rem}
.fontes li{font:500 .9rem/1.45 var(--f-tit);padding-bottom:10px;border-bottom:1px solid var(--linha)}
.fontes strong{font-weight:750}
.fontes .url{word-break:break-all}

.rodape{border-top:1px solid var(--linha);padding:22px 0 30px;font:500 .84rem/1.5 var(--f-tit);color:var(--tinta-2)}
.rodape p{max-width:52rem;margin:0}

/* ---------- telas maiores ---------- */
@media (min-width:640px){
  .numeros{grid-template-columns:repeat(4,minmax(0,1fr))}
  .numeros div{padding-right:14px}
  .cidades{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .atrs{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .fatos div{grid-template-columns:150px 1fr;gap:16px}
  .tr-dados{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dia{padding-left:18px}
  .dia-cab{grid-template-columns:104px minmax(0,1fr);gap:4px 18px}
  .dia-quando{flex-direction:column;gap:2px;padding-top:2px}
  .dia-n{font-size:1.1rem}
  .dia-det{margin-left:122px}
  .dia-btn{grid-column:2}
  .hotel{padding:20px 22px}
}
@media (min-width:880px){
  :root{--topo-alt:112px}
  .topo-datas{display:block}
  .so-estreito{display:none}
  .so-largo{display:grid}
  .busca{display:block;position:relative;inset:auto;top:auto;padding:0;border:0;box-shadow:none;background:none;width:min(300px,26vw);margin-left:auto}
  .busca + .topo-acoes{margin-left:0}
  .busca-res{position:absolute;right:0;top:calc(100% + 8px);margin:0;width:min(540px,82vw);background:var(--folha);border:1px solid var(--linha-2);border-radius:14px;padding:12px;box-shadow:0 18px 40px -18px rgba(27,32,48,.5)}
  .aba{padding-inline:13px;font-size:.95rem}
  .vg{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);grid-template-rows:auto auto 1fr;grid-template-areas:"intro rota" "dest rota" "falta rota";column-gap:clamp(32px,5vw,60px);align-items:start}
  .vg-intro{grid-area:intro}.vg-rota{grid-area:rota}.vg-dest{grid-area:dest}.vg-falta{grid-area:falta}
  .vg-rota{background:var(--folha);border:1px solid var(--linha);border-radius:16px;padding:22px 24px;box-shadow:var(--sombra)}
  .vg-rota .fio>li::after{box-shadow:0 0 0 4px var(--folha)}
  .vg-rota .fio-bv li::before{background:var(--folha)}
  .pais-cab{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
  .cal-grade{display:table;width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border:1px solid var(--linha-2);border-radius:12px;overflow:hidden;background:var(--folha)}
  .agenda-caixa{display:none}
  .cal-grade th{font:700 .8rem var(--f-tit);color:var(--tinta-2);padding:8px 6px;text-align:left;background:var(--papel-2);border-bottom:1px solid var(--linha-2)}
  .cal-grade td{vertical-align:top;height:132px;padding:0;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha)}
  .cal-grade tr td:last-child{border-right:0}
  .cal-grade tr:last-child td{border-bottom:0}
  .cal-fora{background:var(--papel)}
  .cal-fora span{display:block;padding:7px 8px;font:600 .86rem var(--f-tit);color:var(--tinta-3)}
  .cal-vazio{background:var(--papel)}
  .cal-link{display:flex;flex-direction:column;gap:2px;height:100%;min-height:132px;padding:6px 8px 8px;text-decoration:none;color:var(--tinta);border-top:4px solid var(--p);font-family:var(--f-tit)}
  .cal-link:hover{background:var(--pf)}
  .cal-link:focus-visible{outline-offset:-3px}
  .cal-topo{display:flex;justify-content:space-between;align-items:baseline}
  .cal-num{font:800 1.25rem/1 var(--f-tit);font-variant-numeric:tabular-nums}
  .cal-d{font-size:.7rem;font-weight:700;color:var(--p)}
  .cal-local{font-size:.84rem;font-weight:750;line-height:1.2;margin-top:3px}
  .cal-ativ{font-size:.76rem;font-weight:500;line-height:1.25;color:var(--tinta-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .cal-pe{margin-top:auto;display:grid;gap:1px;font-size:.72rem;font-weight:650;line-height:1.25;color:var(--tinta-2);padding-top:4px}
  .cal-pe span{display:flex;align-items:flex-start;gap:4px}
  .cal-pe .tr{color:var(--tinta)}
  .cal-pe .ic{width:13px;height:13px;margin-top:.08em}
  .hoteis{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .trechos{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .entradas{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (min-width:1080px){
  .aba .rot-longo{display:inline}
  .aba .rot-curto{display:none}
  .atrs{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}

/* ---------- impressão: visão geral, roteiro completo, voos e hotéis ---------- */
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    color-scheme:light;
    --papel:#fff;--papel-2:#f3f3f3;--folha:#fff;--tinta:#000;--tinta-2:#333;--tinta-3:#555;
    --linha:#bbb;--linha-2:#888;--elo:#000;--marca:#e6e6e6;

/* v12 | Editorial photography and connected information */
:root{--larg:1240px}
.foto{position:relative;margin:0;overflow:hidden;border-radius:14px;background:var(--papel-2);aspect-ratio:16/10;isolation:isolate}
.foto img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.foto figcaption{position:absolute;inset:auto 0 0;padding:30px 16px 12px;background:linear-gradient(transparent,rgba(10,16,24,.8));color:#fff;font:650 .84rem/1.35 var(--f-tit);z-index:2;text-shadow:0 1px 4px #0006}
.foto figcaption small{display:block;font-size:.72rem;font-weight:450}
.foto-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--tinta-2);padding:20px;background:radial-gradient(ellipse at 20% 20%,var(--pf,var(--th-f)),transparent 65%),linear-gradient(130deg,var(--papel-2),var(--folha));font-family:var(--f-tit);text-align:center}
.foto-fallback .ic{width:34px;height:34px;opacity:.6}
.foto-vazia .foto-fallback{display:flex}.foto-vazia figcaption,.foto-vazia img{display:none}
.capa{display:grid;gap:26px;align-items:center;margin-bottom:24px}
.capa-texto h2{font-size:clamp(3.5rem,8vw,6rem);line-height:.94;letter-spacing:-.055em;margin:0 0 20px;font-weight:800}
.capa-texto h2 em{font-family:var(--f-txt);font-size:.85em;font-weight:500;letter-spacing:-.055em}
.sobretitulo{font:700 .74rem/1.4 var(--f-tit);letter-spacing:.15em;text-transform:uppercase;color:var(--th);margin:0 0 16px}
.capa-paises{font:650 .9rem var(--f-tit);color:var(--tinta-2);margin:0 0 8px}
.capa-desc{font-size:1.05rem;line-height:1.5;max-width:45ch;margin:16px 0 20px}
.capa .numeros{grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 18px}
.capa .numeros dd{font-size:1.85rem}.capa .numeros dt{font-size:.73rem}
.capa .foto-capa{aspect-ratio:5/4;border-radius:20px}.capa .foto-capa figcaption{padding:45px 22px 18px}
.capa .nota-geral{font-size:.78rem;line-height:1.5;max-width:54ch}
.rota-compacta{display:flex;gap:9px;overflow-x:auto;margin:26px 0 42px;padding:0 0 12px;scrollbar-width:thin;font-family:var(--f-tit)}
.rota-compacta a{min-width:112px;flex:1;text-decoration:none;color:var(--tinta);font-weight:700;font-size:.91rem;border-top:2px solid var(--linha-2);padding-top:9px}
.rota-compacta a:hover{border-color:var(--th)}.rota-compacta small{display:block;color:var(--th);font-size:.68rem;letter-spacing:.12em;margin-bottom:4px}.rota-compacta span{display:block;font-size:.73rem;font-weight:500;color:var(--tinta-2);margin-top:4px}
.overview-bottom{display:grid;gap:32px;align-items:start}
.secao-editorial{margin-bottom:20px}.secao-editorial h3{font-size:1.7rem;max-width:24ch;line-height:1.1}.secao-editorial .sobretitulo{margin-bottom:10px}
.experiencias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.experiencia{display:block;text-decoration:none;color:var(--tinta);border:1px solid var(--linha);border-radius:16px;overflow:hidden;background:var(--folha);transition:box-shadow .2s}
.experiencia:hover{box-shadow:var(--sombra)}.experiencia:hover img{transform:scale(1.025)}.experiencia .foto{border-radius:0;aspect-ratio:16/10}.experiencia .foto figcaption{display:none}
.experiencia-texto{display:flex;flex-direction:column;gap:7px;padding:14px 15px 16px;font-family:var(--f-tit)}.experiencia-texto small{font-size:.72rem;color:var(--th);font-weight:650}.experiencia-texto strong{font-size:1.05rem;line-height:1.2}.experiencia-texto>span{font-size:.76rem;color:var(--tinta-2);margin-top:2px}
.pendencias-resumo,.acervo{margin-top:26px;border:1px solid var(--linha);border-radius:14px;padding:16px 18px;background:var(--folha)}
summary{font-family:var(--f-tit);font-weight:650;cursor:pointer;line-height:1.4;min-height:32px}.pendencias-resumo[open] summary,.acervo[open] summary{margin-bottom:16px}
.cidade>.foto{margin:-18px -18px 18px;border-radius:13px 13px 0 0;aspect-ratio:16/8}
.atr>.foto{margin:-16px -16px 16px;border-radius:13px 13px 0 0;aspect-ratio:16/10}.atr-mais>.foto{margin-top:8px;max-width:100%}
.foto-dia{max-width:640px;aspect-ratio:16/7}.foto-dia.foto-vazia{aspect-ratio:16/4}
.programa-transfer{padding-top:14px;border-top:1px solid var(--linha)}.programa-transfer h4,.segmentos h4{font-size:1rem;margin-bottom:10px}
.programa-transfer ol{list-style:none;display:grid;margin:14px 0;gap:0}.programa-transfer li{display:grid;grid-template-columns:103px minmax(0,1fr);gap:13px;padding:10px 0;border-bottom:1px solid var(--linha)}
.prog-hora{font:700 .77rem/1.5 var(--f-tit);color:var(--th);padding-top:2px}.programa-transfer strong{font:700 .94rem/1.3 var(--f-tit)}.programa-transfer li p{font-size:.86rem;line-height:1.45;margin:4px 0 0;color:var(--tinta-2)}
.acoes-contexto{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.acoes-contexto .btn{font-size:.78rem;padding:9px 12px}
.segmento{border:1px solid var(--linha);border-radius:10px;padding:12px;margin-top:9px;font-family:var(--f-tit)}.segmento>div{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}.segmento>p{margin:6px 0;font-size:1.05rem}.segmento>small{display:block;font-size:.76rem;line-height:1.4;color:var(--tinta-2)}
.dia-navegacao{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--linha);font:650 .8rem var(--f-tit)}.dia-navegacao a{padding:10px 0}.dia-navegacao .btn{font-size:.78rem;margin-inline:auto}
.reavaliacoes{padding:14px;border:1px dashed var(--linha-2);border-radius:10px;background:var(--papel-2)}.reavaliacoes p{font-size:.88rem}.papel-reavaliar{border:1px dashed var(--linha-2);color:var(--tinta-2)}
.galeria-fotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.acervo>p{font-size:.9rem;max-width:65ch}.foto-acervo{aspect-ratio:4/3}.foto-acervo figcaption{font-size:.76rem}
.voltar-contexto{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:25;max-width:calc(100vw - 32px);background:var(--tinta);color:var(--papel);border:1px solid var(--linha);border-radius:999px;padding:12px 20px;box-shadow:0 8px 30px #0003;font:650 .85rem var(--f-tit)}
.status-copia{position:fixed;bottom:20px;right:16px;z-index:50;max-width:85vw;padding:12px 18px;background:var(--tinta);color:var(--papel);border-radius:10px;font:600 .85rem var(--f-tit)}
@media(min-width:880px){.capa{grid-template-columns:1fr 1fr;gap:38px}.capa .foto-capa{aspect-ratio:4/5;max-height:600px}.overview-bottom{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px}.galeria-fotos{grid-template-columns:repeat(4,minmax(0,1fr))}.capa-imagem{align-self:stretch}.foto-capa{height:100%}.trecho:has(.programa-transfer),.trecho:has(.segmentos){grid-column:1/-1}.programa-transfer ol{grid-template-columns:1fr 1fr;gap:0 26px}.segmentos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.segmentos h4{grid-column:1/-1}.segmento{margin:0}}
@media(max-width:560px){.capa-texto h2{font-size:3.7rem}.capa{gap:18px}.capa .foto-capa{aspect-ratio:16/9}.experiencias{gap:12px}.experiencia-texto{padding:11px}.experiencia-texto strong{font-size:.93rem}.experiencia-texto>span{font-size:.7rem}.capa .numeros{grid-template-columns:repeat(2,minmax(0,1fr))}.galeria-fotos{grid-template-columns:1fr 1fr}.foto-acervo figcaption{font-size:.7rem}.programa-transfer li{grid-template-columns:86px 1fr;gap:10px}.capa-desc{font-size:1rem}.rota-compacta{margin-bottom:30px}}
@media print{.foto,.capa-imagem,.rota-compacta,.acervo,.voltar-contexto,.status-copia,.experiencias{display:none!important}.capa,.overview-bottom{display:block}.capa-texto h2{font-size:28pt}.pendencias-resumo{display:none}.vg-rota{margin-top:20pt}.programa-transfer li{break-inside:avoid}.programa-transfer ol{display:block}.acoes-contexto{display:none}}
/* Keep inherited named grid areas scoped to their original parent. */
.overview-bottom>.vg-rota{grid-area:auto;min-width:0}

@media(min-width:880px){.overview-bottom>.vg-rota{grid-column:2;grid-row:1}.overview-bottom>section{grid-column:1;grid-row:1}}

          '<span class="cal-pe">' + transpCal(d) + '<span>' + ic('cama') + esc(pernoiteTxt(d)) + '</span></span></a></td>';
      }
      h += '</tr>';
    }
    h += '</tbody></table>';
    /* agenda cronológica (telas estreitas) */
    var mesAtual = '';
    h += '<div class="agenda-caixa">';
    V.dias.forEach(function (d) {
      var p = pd(d.data), chave = p.y + '-' + p.m;
      if (chave !== mesAtual) {
        if (mesAtual) { h += '</ol></section>'; }
        mesAtual = chave;
        h += '<section class="cal-mes"><h3>' + MESL[p.m - 1].charAt(0).toUpperCase() + MESL[p.m - 1].slice(1) + ' de ' + p.y + '</h3><ol class="agenda">';
      }
      h += '<li class="p-' + d.cor + '"><a class="ag-link" href="#dia-' + d.n + '">' +
        '<span class="ag-quando"><span class="ag-num">' + p.d + '</span><span class="ag-sem">' + DS[dsem(d.data)] + '</span><span class="ag-dia">Dia ' + d.n + '</span></span>' +
        '<span><span class="ag-local">' + esc(d.local) + '</span><span class="ag-ativ">' + esc(d.curto) + '</span>' +
        '<span class="ag-pe">' + transpCal(d) + '<span>' + ic('cama') + esc(pernoiteTxt(d)) + '</span></span></span></a></li>';
    });
    h += '</ol></section></div>';
    return h;
  }

  /* ---------- 4.3 Países e cidades ---------- */
  function pPaises() {
    var h = '<header class="painel-cab"><h2>Países e cidades</h2><p>Os quatro países na ordem em que aparecem, com as cidades onde dormimos e os lugares que visitamos em bate-volta.</p></header>';
    V.paises.forEach(function (p) {
      var ests = V.estadias.filter(function (e) { return e.pais === p.id; });
      var noites = ests.reduce(function (s, e) { return s + e.noites.length; }, 0);
      var cids = ORDEM_CID.filter(function (c) { return CID[c].pais === p.id; });
      h += '<section class="pais p-' + p.id + '" data-ancora="pais-' + p.id + '"><div class="pais-cab"><div>' +
        '<h3 class="pais-nome" tabindex="-1">' + esc(p.nome) + '</h3>' +
        '<p class="pais-papel">' + plural(noites, 'noite', 'noites') + ' em ' + lista(cids.map(function (c) { return esc(CID[c].nome); })) + '. ' + esc(p.papel) + '</p>' +
        '<p class="pais-intro">' + fmt(p.intro) + '</p></div>' +
        '<dl class="fatos">' +
        '<div><dt>Idioma</dt><dd>' + fmt(p.idioma) + '</dd></div>' +
        '<div><dt>Moeda</dt><dd>' + fmt(p.moeda) + '</dd></div>' +
        '<div><dt>À mesa</dt><dd>' + fmt(p.comida) + '</dd></div>' +
        '<div><dt>Etiqueta</dt><dd>' + fmt(p.etiqueta) + '</dd></div>' +
        '<div><dt>Clima na época</dt><dd>' + fmt(p.clima) + '</dd></div></dl></div>';
      h += '<div class="cidades">';
      cids.forEach(function (cid) {
        var c = CID[cid], es = V.estadias.filter(function (e) { return e.cidade === cid; });
        h += '<article class="cidade" data-ancora="cidade-' + c.id + '">' + foto(c.imagem,'foto-cidade',false) + '<h4 tabindex="-1">' + esc(c.nome) + '</h4><p class="cid-tipo">';
        h += es.map(function (e, i) {
          return (es.length > 1 ? (i + 1) + 'ª estadia: ' : 'Cidade-base: ') + plural(e.noites.length, 'noite', 'noites') + ', de ' + dCurta(e.checkin) + ' a ' + dCurta(e.checkout);
        }).join('<br>') + '</p>';
        h += '<p>' + fmt(c.texto) + '</p><p><strong>O que esperar:</strong> ' + fmt(c.esperar) + '</p><ul class="cid-links">';
        es.forEach(function (e) {
          var dn = DIA_DATA[e.checkin].n, df = DIA_DATA[e.checkout] ? DIA_DATA[e.checkout].n : dn;
          h += '<li><a href="#dia-' + dn + '">' + ic('pin') + 'Roteiro: dias ' + dn + ' a ' + df + '</a></li>';
          h += '<li><a href="#' + e.id + '">' + ic('cama') + esc(e.hotel) + '</a></li>';
        });
        h += '</ul>';
        var naCidade = V.atracoes.filter(function (x) { return x.cidade === cid && !x.local; });
        if (naCidade.length) { h += '<p class="cid-atr"><strong>Na cidade:</strong> ' + naCidade.map(function (x) { return '<a href="#' + x.id + '">' + esc(x.nome) + '</a>'; }).join(', ') + '.</p>'; }
        if (c.bateVoltas && c.bateVoltas.length) {
          h += '<ul class="bvs">' + c.bateVoltas.map(function (b) {
            var dn = DIA_DATA[b.data].n;
            return '<li class="bv" data-ancora="bv-' + b.id + '"><h5 tabindex="-1">' + esc(b.nome) + '</h5><p class="bv-rot">' + esc(b.rotulo) + '</p><p>' + fmt(b.texto) + ' ' +
              linkDia(dn, 'Ver o dia ' + dn) + '. ' + (b.atr || []).filter(function (id) { return ATR[id]; }).map(function (id) { return '<a href="#' + id + '">' + esc(ATR[id].nome) + '</a>'; }).join(', ') + '.</p></li>';
          }).join('') + '</ul>';
        }
        h += '</article>';
      });
      h += '</div></section>';
    });
    return h + galeria();
  }

  /* ---------- 4.4 Roteiro dia a dia ---------- */
  var ETQ = {
    'voo': ['aviao', 'Dia de voo'], 'estrada': ['van', 'Estrada'], 'bate-volta': ['idavolta', 'Bate-volta'], 'livre': ['livre', 'Tempo livre'],
    'cheio': ['alerta', 'Dia cheio'], 'divide': ['grupo', 'Grupo se divide'], 'cedo': ['relogio', 'Começa de madrugada']
  };
  function htmlBilhete(t, chegando) {
    var h = '<div class="bilhete"><div class="bil-rota">' + ic(icTipo(t)) + '<span>' + esc(nomeTipo(t)) + ': ' + esc(t.rotulo) + '</span></div>';
    if (chegando) { h += '<div class="bil-hora">Chegada às ' + esc(t.chegada) + '</div>'; }
    else if (t.partida) { h += '<div class="bil-hora">' + esc(horaTrecho(t)) + '</div>'; }
    h += '<div class="bil-meta"><span>' + esc(t.cia) + '</span>' + (t.via ? '<span>' + esc(t.via) + '</span>' : '') + (!chegando && !t.partida ? '<span>Horário ' + (t.aereo ? 'não informado' : 'a definir') + '</span>' : '') + selo(t.status) + '<a href="#' + t.id + '">Ver o trecho completo</a></div></div>';
    return h;
  }
  function htmlDia(d) {
    var nomesPais = d.paises.map(function (p) { return PAIS[p].nome; });
    var h = '<li class="dia p-' + d.cor + '" data-ancora="dia-' + d.n + '" data-paises="' + d.paises.join(' ') + '" data-cidades="' + d.cidades.join(' ') + '"><article>';
    h += '<header class="dia-cab"><div class="dia-quando"><span class="dia-n">Dia ' + d.n + '</span><time datetime="' + d.data + '">' + dSem(d.data) + '</time></div><div>';
    h += '<p class="dia-onde">' + esc((nomesPais.length ? lista(nomesPais) + ': ' : '') + d.local) + '</p>';
    h += '<h4 class="dia-tit" tabindex="-1">' + esc(d.titulo) + '</h4><p class="dia-res">' + fmt(d.resumo) + '</p>';
    if (d.logistica) { h += aviso('log', 'info', fmt(d.logistica)); }
    if (d.etiquetas && d.etiquetas.length) {
      h += '<ul class="etqs">' + d.etiquetas.map(function (e) { var x = ETQ[e]; return x ? '<li class="etq">' + ic(x[0]) + esc(x[1]) + '</li>' : ''; }).join('') + '</ul>';
    }
    h += '<p class="dia-pe">';
    d.chegadas.forEach(function (t) { h += '<span>' + ic(icTipo(t)) + '<span>Chegada do <a href="#' + t.id + '">voo ' + esc(t.rotulo) + '</a> às ' + esc(t.chegada) + '</span></span>'; });
    d.partidas.forEach(function (t) { h += '<span>' + ic(icTipo(t)) + '<span><a href="#' + t.id + '">' + esc(nomeTipo(t)) + ' ' + esc(t.rotulo) + '</a>' + (t.partida ? ', ' + esc(horaTrecho(t)) : '') + '</span></span>'; });
    if (d.estadia) {
      h += '<span>' + ic('cama') + '<span>Pernoite em ' + esc(CID[d.estadia.cidade].nome) + ': <a href="#' + d.estadia.id + '">' + esc(d.estadia.hotel) + '</a>' +
        (d.noite.status !== 'Reservado' && d.noite.status !== 'Pago' ? ' ' + selo(d.noite.status) : '') + '</span></span>';
    } else { h += '<span>' + ic(d.fimViagem ? 'check' : 'aviao') + '<span>' + esc(pernoiteTxt(d)) + '</span></span>'; }
    h += '</p></div>' + botaoMais('det-dia-' + d.n, 'Ver detalhes', 'do dia ' + d.n) + '</header>';

    h += '<div class="dia-det" id="det-dia-' + d.n + '" hidden>';
    if (DIA_FOTO[d.n]) { h += foto(DIA_FOTO[d.n],'foto-dia',false); }
    h += '<section class="det"><h5>O dia por período</h5><dl class="periodos">' + d.periodos.map(function (p) { return '<div><dt>' + esc(p.rotulo) + '</dt><dd>' + fmt(p.texto) + '</dd></div>'; }).join('') + '</dl></section>';
    if (d.atividades.length) {
      h += '<section class="det"><h5>Passeios e atividades</h5><ul class="ativs">' + d.atividades.map(function (a) {
        var meta = [esc(a.periodo)];
        if (a.pessoas) { meta.push('previsto para ' + plural(a.pessoas, 'pessoa', 'pessoas')); }
        if (a.provedor) { meta.push('provedor: ' + esc(a.provedor)); }
        return '<li class="ativ"><div class="ativ-topo">' + selosAtividade(a) + '</div><div class="ativ-nome"><a href="#' + a.atr + '">' + esc(a.nome) + '</a></div>' +
          '<p class="ativ-meta">' + meta.join(', ') + (a.nota ? '. ' + fmt(a.nota) : '') + '</p></li>';
      }).join('') + '</ul></section>';
    }
    if (d.partidas.length || d.chegadas.length) {
      h += '<section class="det"><h5>Como vamos chegar</h5>' + d.chegadas.map(function (t) { return htmlBilhete(t, true); }).join('') + d.partidas.map(function (t) { return htmlBilhete(t, false); }).join('') + '</section>';
    }
    h += '<section class="det"><h5>Onde vamos dormir</h5><ul class="lista">';
    if (d.checkout) { h += '<li>Check-out do ' + esc(d.checkout.hotel) + ', em ' + esc(CID[d.checkout.cidade].nome) + '.</li>'; }
    if (d.estadia) {
      h += '<li>' + (d.checkin ? 'Check-in no ' : 'Mais uma noite no ') + '<a href="#' + d.estadia.id + '">' + esc(d.estadia.hotel) + '</a>, em ' + esc(CID[d.estadia.cidade].nome) + '. Noite de ' + dCurta(d.data) + ': ' + selo(d.noite.status) + (d.noite.nota ? ' ' + fmt(d.noite.nota) : '') + '</li>';
    } else { h += '<li>' + esc(d.fimViagem ? 'Fim da viagem no Rio. Sem hotel adicional.' : 'Noite em trânsito, sem hotel.') + '</li>'; }
    h += '</ul></section>';
    if (d.notas && d.notas.length) { h += '<section class="det"><h5>Vale saber</h5><ul class="lista">' + d.notas.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></section>'; }
    if (d.pendencias && d.pendencias.length) { h += '<section class="det"><h5>Ainda a acertar</h5><ul class="lista lista-pend">' + d.pendencias.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></section>'; }
    h += reavaliacoes(d) + ferramentasDia(d) + '</div></article></li>';
    return h;
  }
  function pRoteiro() {
    var h = '<header class="painel-cab"><h2>Roteiro dia a dia</h2><p>Cada dia traz um resumo e, em “Ver detalhes”, o que fazemos de manhã, à tarde e à noite, como chegamos e onde dormimos.</p></header>';
    h += '<div class="barra"><div class="barra-grupo" role="group" aria-label="Filtrar o roteiro por país"><span class="barra-rot">País</span>' + chips('fr-pais', opcoesPais(), estado.fr.pais) + '</div>' +
      '<div class="barra-grupo"><label class="barra-rot" for="fr-cidade">Cidade</label><select class="sel" id="fr-cidade" data-filtro="fr-cidade"></select></div>' +
      '<div class="barra-acoes"><button type="button" class="btn btn-leve" id="abrir-todos">Expandir todos</button><button type="button" class="btn btn-leve" id="fechar-todos">Recolher todos</button></div></div>';
    h += '<p class="conta" id="fr-conta" role="status" aria-live="polite"></p><div class="vazio" id="fr-vazio" hidden><p>Nenhum dia corresponde a esse filtro.</p><button type="button" class="btn" data-limpar="fr">Limpar filtros</button></div>';
    V.etapas.forEach(function (et) {
      var ds = V.dias.filter(function (d) { return d.n >= et.de && d.n <= et.ate; });
      var ests = ds.map(function (d) { return d.estadia; }).filter(function (e, i, a) { return e && a.indexOf(e) === i; });
      var sub = (ds.length > 1 ? 'Dias ' + et.de + ' a ' + et.ate + ', de ' + dCurta(ds[0].data) + ' a ' + dCurta(ds[ds.length - 1].data) : 'Dia ' + et.de + ', ' + dCurta(ds[0].data)) + '. ';
      sub += ests.length ? lista(ests.map(function (e) {
        var n = ds.filter(function (d) { return d.estadia === e; }).length;
        return plural(n, 'noite', 'noites') + ' no <a href="#' + e.id + '">' + esc(e.hotel) + '</a>';
      })) + '.' : 'Noite a bordo.';
      h += '<section class="etapa" data-ancora="' + et.id + '"><div class="etapa-cab"><h3 tabindex="-1">' + esc(et.titulo) + '</h3><p>' + sub + '</p></div><ol class="dias">' + ds.map(htmlDia).join('') + '</ol></section>';
    });
    return h;
  }

  /* ---------- 4.5 Principais atrações ---------- */
  function pAtracoes() {
    var h = '<header class="painel-cab"><h2>Principais atrações</h2><p>O que é cada lugar, por que entra no roteiro e em que dia. O selo mostra se o passeio é planejado, opcional ou alternativa, e como está a contratação.</p></header>';
    h += '<div class="barra"><div class="barra-grupo" role="group" aria-label="Filtrar atrações por país"><span class="barra-rot">País</span>' + chips('fa-pais', opcoesPais(), estado.fa.pais) + '</div>' +
      '<div class="barra-grupo" role="group" aria-label="Filtrar atrações por tipo"><span class="barra-rot">Tipo</span>' + chips('fa-tipo', [{ v: 'todos', t: 'Todos' }, { v: 'planejado', t: 'Planejado' }, { v: 'opcional', t: 'Opcional' }, { v: 'alternativa', t: 'Alternativa' }, { v: 'livre', t: 'Por conta própria' }], estado.fa.tipo) + '</div>' +
      '<div class="barra-grupo"><label class="barra-rot" for="fa-cidade">Cidade-base</label><select class="sel" id="fa-cidade" data-filtro="fa-cidade"></select></div></div>';
    h += '<p class="conta" id="fa-conta" role="status" aria-live="polite"></p><div class="vazio" id="fa-vazio" hidden><p>Nenhuma atração corresponde a esse filtro.</p><button type="button" class="btn" data-limpar="fa">Limpar filtros</button></div>';
    ORDEM_CID.forEach(function (cid) {
      var c = CID[cid], as = V.atracoes.filter(function (a) { return a.cidade === cid; });
      as.sort(function (x, y) { var a = x.ocorrencias[0], b = y.ocorrencias[0]; return (a ? a.dia : 99) - (b ? b.dia : 99); });
      h += '<section class="grupo-cid p-' + c.pais + '" data-grupo="' + cid + '"><h3>' + esc(c.nome) + '<small>' + esc(PAIS[c.pais].nome) + '</small></h3><ul class="atrs">';
      as.forEach(function (a) {
        var provs = a.ocorrencias.map(function (o) { return o.provedor; }).filter(function (x, i, arr) { return x && arr.indexOf(x) === i; });
        h += '<li class="atr p-' + a.pais + '" data-ancora="' + a.id + '" data-pais="' + a.pais + '" data-cidade="' + a.cidade + '" data-papeis="' + a.papeis.join(' ') + '">';
        h += (a.imagens && a.imagens.length ? foto(a.imagens[0],'foto-atracao',false) : '') + '<h4 tabindex="-1">' + esc(a.nome) + '</h4><p class="atr-onde">' + esc(a.local ? a.local + '. A partir de ' + c.nome : c.nome) + ', ' + esc(PAIS[a.pais].nome) + '</p>';
        h += '<p class="atr-oque">' + fmt(a.oQue) + '</p><ul class="atr-quando">' + a.ocorrencias.map(function (o) {
          return '<li>' + linkDia(o.dia, dCurta(o.data) + ', dia ' + o.dia) + '<span>' + esc(o.periodo.toLowerCase()) + '</span>' + selosAtividade(o) + (o.pessoas ? '<span>previsto para ' + plural(o.pessoas, 'pessoa', 'pessoas') + '</span>' : '') + '</li>';
        }).join('') + '</ul>';
        h += botaoMais('mais-' + a.id, 'Mais sobre a atração', a.nome);
        h += '<div class="atr-mais" id="mais-' + a.id + '" hidden><div><h5>Por que entra no roteiro</h5><p>' + fmt(a.porQue) + '</p></div><div><h5>O que esperar</h5><p>' + fmt(a.esperar) + '</p></div>';
        if (a.imagens && a.imagens.length > 1) { h += foto(a.imagens[1],'foto-secundaria',false); }
        if (a.duracao) { h += '<div><h5>Duração</h5><p>' + fmt(a.duracao) + ' (' + (a.duracaoTipo === 'estimativa' ? 'estimativa' : (a.duracaoTipo === 'referencia' ? 'referência do operador' : 'conforme a planilha')) + ')</p></div>'; }
        if (provs.length) { h += '<div><h5>Provedor</h5><p>' + esc(provs.join(', ')) + '</p></div>'; }
        if (a.pratico && a.pratico.length) { h += '<div><h5>Na prática</h5><ul class="lista">' + a.pratico.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></div>'; }
        h += '</div></li>';
      });
      h += '</ul></section>';
    });
    return h;
  }

  /* ---------- 4.6 Voos e transfers ---------- */
  function htmlPonto(hora, sub, lugar, cod, aeroporto) {
    return '<div class="tr-ponto"><span class="tr-hora">' + (hora ? esc(hora) : '—') + (sub ? '<small' + (/^\+/.test(sub) ? ' class="mais"' : '') + '>' + esc(sub) + '</small>' : '') + '</span><span class="tr-lugar">' + esc(lugar) + (cod ? ' (' + esc(cod) + ')' : '') + (aeroporto ? '<span>' + esc(aeroporto) + '</span>' : '') + '</span></div>';
  }
  function pVoos() {
    var st = contarStatus(V.transportes);
    var h = '<header class="painel-cab"><h2>Voos e transfers</h2><p>Os ' + V.transportes.length + ' trechos entre cidades, em ordem. Horários são locais. ' + (st['Pago'] || 0) + ' pagos, ' + (st['Reservado'] || 0) + ' reservado e ' + (st['A contratar'] || 0) + ' a contratar.</p></header>';
    h += '<ul class="lista notas-topo">' + (V.meta.notasTransporte || []).map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul>';
    h += '<div class="barra"><div class="barra-grupo" role="group" aria-label="Filtrar trechos por tipo"><span class="barra-rot">Mostrar</span>' + chips('fv-tipo', [{ v: 'todos', t: 'Todos' }, { v: 'aereo', t: 'Voos' }, { v: 'terrestre', t: 'Por terra' }], estado.fv.tipo) + '</div></div>';
    h += '<p class="conta" id="fv-conta" role="status" aria-live="polite"></p><div class="vazio" id="fv-vazio" hidden><p>Nenhum trecho corresponde a esse filtro.</p><button type="button" class="btn" data-limpar="fv">Limpar filtros</button></div>';
    h += '<ul class="trechos">';
    V.transportes.forEach(function (t) {
      h += '<li class="trecho" data-ancora="' + t.id + '" data-tipo="' + (t.aereo ? 'aereo' : 'terrestre') + '">';
      h += '<div class="tr-quando">' + ic(icTipo(t)) + '<span class="tr-data"><time datetime="' + t.data + '">' + dSem(t.data) + ' ' + pd(t.data).y + '</time></span><span class="tr-tipo">' + esc(nomeTipo(t)) + '</span>' + (t.diaN ? '<a class="tr-dia" href="#dia-' + t.diaN + '">Dia ' + t.diaN + '</a>' : '') + '</div><div class="tr-corpo">';
      h += '<h3 class="tr-rota" tabindex="-1">' + esc(t.rotulo) + '</h3>' + (t.via ? '<p class="tr-via">' + esc(t.via) + '</p>' : '');
      if (t.aereo) {
        h += '<div class="tr-pontos">' + htmlPonto(t.partida, t.partida ? 'saída' : 'não informado', t.de.lugar, t.de.cod, t.de.aeroporto) +
          htmlPonto(t.chegada, t.chegada ? (t.maisDias ? '+' + t.maisDias + ' dia, em ' + dCurta(t.chegadaData) : 'chegada') : 'não informado', t.para.lugar, t.para.cod, t.para.aeroporto) + '</div>';
      }
      h += '<dl class="tr-dados"><div><dt>' + (t.aereo ? 'Companhia' : 'Operador') + '</dt><dd>' + esc(t.cia) + '</dd></div>';
      if (t.aereo) { h += '<div><dt>Nº do voo</dt><dd class="' + (t.numero ? '' : 'nao') + '">' + esc(t.numero || 'não informado') + '</dd></div>'; }
      else { h += '<div><dt>Horário</dt><dd>' + esc(t.horarioReferencia || 'A definir') + '</dd></div>'; }
      h += '<div><dt>Duração' + (t.duracaoTipo === 'estimativa' ? ' (estimativa)' : '') + '</dt><dd>' + esc(t.duracao) + '</dd></div><div><dt>Grupo</dt><dd>' + esc(t.grupo) + '</dd></div></dl>';
      h += '<p>' + selo(t.status) + '</p>' + segmentos(t) + programa(t);

  /* ======================================================================

  var PREFIXOS = [['dia-', 'roteiro'], ['etapa-', 'roteiro'], ['atr-', 'atracoes'], ['trecho-', 'voos'], ['hotel-', 'hoteis'], ['cidade-', 'paises'], ['pais-', 'paises'], ['bv-', 'paises'], ['orient-', 'orientacoes']];

    if (el.hidden || (el.closest('[hidden]') && el.closest('[hidden]') !== painel)) {
      if (painel.id === 'painel-roteiro') { limpar('fr'); }

  }
  function rota() {
    var h = '';

    var aba = null, alvo = null;
    if (ABAS.some(function (a) { return a.id === h; })) { aba = h; }
    else if (h) { PREFIXOS.forEach(function (p) { if (!aba && h.indexOf(p[0]) === 0) { aba = p[1]; alvo = h; } }); }
    if (!aba) { aba = estado.aba || 'visao-geral'; }
    var mudou = aba !== estado.aba;

  V.paises.forEach(function (p) { ind('Países e cidades', 'pais-' + p.id, p.nome, 'País', [p.intro, p.idioma, p.moeda, p.comida, p.etiqueta, p.clima].join(' ')); });
  V.cidades.forEach(function (c) {
    ind('Países e cidades', 'cidade-' + c.id, c.nome, 'Cidade-base, ' + PAIS[c.pais].nome, [c.texto, c.esperar].join(' '));
    (c.bateVoltas || []).forEach(function (b) { ind('Países e cidades', 'bv-' + b.id, b.nome, b.rotulo, b.texto + ' bate-volta'); });
  });
  ind('Orientações', 'orient-documentos', 'Documentos e entrada nos países', 'Vistos, formulários digitais e passaporte',
    [V.orientacoes.nacionalidade].concat(V.orientacoes.passaporte, V.orientacoes.entradas.map(function (e) { return [PAIS[e.pais].nome, e.visto, e.formulario, e.extra, 'visto imigração'].join(' '); })).join(' '));
  V.orientacoes.secoes.forEach(function (s) { ind('Orientações', s.id, s.titulo, 'Orientações gerais', s.itens.join(' ')); });
  ind('Orientações', 'orient-checklist', 'Checklist', 'Antes de embarcar e durante a viagem', V.orientacoes.checklist.map(function (c) { return c.texto; }).join(' '));

  var elBusca = $('#busca'), elCampo = $('#campo-busca'), elRes = $('#busca-res'), elLista = $('#busca-lista'), elConta = $('#busca-conta'), btnBusca = $('#btn-busca');
  function buscar() {
    var q = norm(elCampo.value).trim();
    if (q.length < 2) { elRes.hidden = true; elLista.innerHTML = ''; elConta.textContent = ''; return; }
    var termos = q.split(/\s+/);
    var achados = INDICE.filter(function (x) { return termos.every(function (t) { return x.n.indexOf(t) >= 0; }); });
    elRes.hidden = false;
    if (!achados.length) {
      elConta.textContent = 'Nenhum resultado.';
      elLista.innerHTML = '<div class="busca-vazio"><p>Nada encontrado para “' + esc(elCampo.value.trim()) + '”. Tente o nome de uma cidade, de um hotel ou uma data, como 11/01.</p><button type="button" class="btn btn-leve" id="busca-limpar">Limpar busca</button></div>';
      return;
    }
    elConta.textContent = plural(achados.length, 'resultado', 'resultados') + '.';
    var grupos = [], porGrupo = {};
    achados.forEach(function (x) { if (!porGrupo[x.g]) { porGrupo[x.g] = []; grupos.push(x.g); } porGrupo[x.g].push(x); });
    elLista.innerHTML = grupos.map(function (g) {
      return '<section class="busca-grupo"><h2>' + esc(g) + '</h2><ul>' + porGrupo[g].slice(0, 12).map(function (x) {
        return '<li><a href="#' + x.a + '"><strong>' + esc(x.t) + '</strong><span>' + esc(x.s) + '</span></a></li>';
      }).join('') + '</ul></section>';
    }).join('');
  }
  function fecharBusca() {
    elRes.hidden = true;
    if (elBusca.classList.contains('aberta')) { elBusca.classList.remove('aberta'); btnBusca.setAttribute('aria-expanded', 'false'); }
  }
  var tBusca = null;
  elCampo.addEventListener('input', function () { clearTimeout(tBusca); tBusca = setTimeout(buscar, 90); });
  elCampo.addEventListener('focus', function () { if (elCampo.value.trim().length >= 2) { buscar(); } });
  elBusca.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { var aberto = elBusca.classList.contains('aberta'); fecharBusca(); if (aberto) { btnBusca.focus(); } else { elCampo.focus(); } }
  });
  elLista.addEventListener('click', function (ev) { if (ev.target.closest('#busca-limpar')) { elCampo.value = ''; buscar(); elCampo.focus(); } });
  btnBusca.addEventListener('click', function () {
    var abre = !elBusca.classList.contains('aberta');
    elBusca.classList.toggle('aberta', abre); btnBusca.setAttribute('aria-expanded', String(abre));
    if (abre) { elCampo.focus(); buscar(); } else { elRes.hidden = true; }
  });
  /* a data 11/01 também vale como termo de busca */
  V.dias.forEach(function (d, i) { INDICE[i].n += ' ' + dCurta(d.data) + ' ' + norm(dLonga(d.data)); });

  /* ======================================================================
     9. Tema, impressão e checklist (guardados só neste navegador)
     ====================================================================== */
  var CH_TEMA = 'viagem-indochina:tema', CH_CHECK = 'viagem-indochina:checklist';
  function ler(ch) { try { return window.localStorage.getItem(ch); } catch (e) { return null; } }
  function gravar(ch, v) { try { if (v == null) { window.localStorage.removeItem(ch); } else { window.localStorage.setItem(ch, v); } } catch (e) { /* armazenamento indisponível */ } }
  var TEMAS = ['auto', 'light', 'dark'], NOME_TEMA = { auto: 'automático', light: 'claro', dark: 'escuro' };
  var tema = TEMAS.indexOf(ler(CH_TEMA)) >= 0 ? ler(CH_TEMA) : 'auto';
  function aplicarTema() {
    if (tema === 'auto') { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', tema); }
    var prox = TEMAS[(TEMAS.indexOf(tema) + 1) % 3];
    $('#tema-rotulo').textContent = 'Tema: ' + NOME_TEMA[tema] + '. Mudar para ' + NOME_TEMA[prox];
    $('#btn-tema').title = 'Tema: ' + NOME_TEMA[tema];
  }
  $('#btn-tema').addEventListener('click', function () { tema = TEMAS[(TEMAS.indexOf(tema) + 1) % 3]; gravar(CH_TEMA, tema === 'auto' ? null : tema); aplicarTema(); });
  $('#btn-imprimir').addEventListener('click', function () { window.print(); });
  $('#btn-imprimir').title = 'Imprimir o roteiro';
  function salvarCheck() { var o = {}; $$('[data-check]').forEach(function (c) { if (c.checked) { o[c.getAttribute('data-check')] = 1; } }); gravar(CH_CHECK, JSON.stringify(o)); }
  (function carregarCheck() { var o = {}; try { o = JSON.parse(ler(CH_CHECK) || '{}') || {}; } catch (e) { o = {}; } $$('[data-check]').forEach(function (c) { c.checked = !!o[c.getAttribute('data-check')]; }); })();

  /* ======================================================================
     10. Partida
     ====================================================================== */
  var contextoDia = null;
  var voltar = document.createElement('button'); voltar.type='button'; voltar.className='voltar-contexto nao-imprime'; voltar.hidden=true; document.body.appendChild(voltar);
  voltar.addEventListener('click',function(){if(contextoDia)ir(contextoDia);});
  function sincronizarContexto(){var hash=location.hash.slice(1);if(/^dia-/.test(hash)){contextoDia=hash;voltar.hidden=true;}else{voltar.hidden=!contextoDia;voltar.textContent='Voltar ao dia '+(contextoDia||'').replace('dia-','');}}
  window.addEventListener('hashchange',sincronizarContexto);sincronizarContexto();
  document.addEventListener('error',function(ev){var im=ev.target;if(im && im.tagName==='IMG' && im.closest('.foto')){im.closest('.foto').classList.add('foto-vazia');im.remove();}},true);
  var copyStatus=document.createElement('div');copyStatus.className='status-copia nao-imprime';copyStatus.setAttribute('role','status');copyStatus.setAttribute('aria-live','polite');copyStatus.hidden=true;document.body.appendChild(copyStatus);
  document.addEventListener('click',function(ev){var b=ev.target.closest('.copiar-link');if(!b)return;var url=location.href.split('#')[0]+'#'+b.dataset.link;function done(ok){copyStatus.textContent=ok?'Link copiado.':'Copie o link na barra de enderecos.';copyStatus.hidden=false;setTimeout(function(){copyStatus.hidden=true;},2600);}function fallback(){var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();done(ok);}if(navigator.clipboard && window.isSecureContext){navigator.clipboard.writeText(url).then(function(){done(true);},fallback);}else fallback();});

  aplicarTema(); aplicarRoteiro(); aplicarAtracoes(); aplicarVoos();
  medirTopo(); rota(); medirTopo();
  /* quando as fontes terminam de carregar o texto muda de altura: reposiciona o item aberto por link direto */
  function reposicionar() { medirTopo(); if (alvoEl && Date.now() - t0 < 6000 && location.hash) { alvoEl.scrollIntoView({ block: 'start' }); } }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(reposicionar); }
  window.addEventListener('load', reposicionar);
})();
</script>
</body>
</html>
